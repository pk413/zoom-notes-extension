<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZoomNotes</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <span class="logo">🎙</span>
      <h1 class="title">ZoomNotes</h1>
    </div>
    <button class="icon-btn settings-btn" id="settingsBtn" title="Settings" aria-label="Open Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <!-- Status Bar -->
  <section class="status-bar" aria-label="Service Status">
    <div class="status-badge" id="badgeGemini">
      <span class="badge-dot" id="dotGemini">●</span>
      <span class="badge-label">Gemini</span>
    </div>
    <div class="status-badge" id="badgeNotion">
      <span class="badge-dot" id="dotNotion">●</span>
      <span class="badge-label">Notion</span>
    </div>
    <div class="status-badge" id="badgePi">
      <span class="badge-dot" id="dotPi">●</span>
      <span class="badge-label">Rasp. Pi</span>
    </div>
  </section>

  <!-- Recording Status -->
  <section class="rec-status-row">
    <div class="rec-indicator" id="recIndicator">
      <span class="rec-dot" id="recDot">⚪</span>
      <span class="rec-label" id="recLabel">Idle</span>
    </div>
    <div class="timer" id="timerDisplay" aria-live="polite">00:00:00</div>
  </section>

  <!-- Zoom Tabs -->
  <section class="card tabs-section">
    <div class="card-header">
      <span class="card-title">Zoom Meetings</span>
      <span class="tab-count badge-count" id="tabCount">0 found</span>
    </div>
    <div id="tabList" class="tab-list" aria-label="Open Zoom tabs">
      <div class="empty-state" id="emptyState">
        <span class="empty-icon">🔍</span>
        <p>No Zoom tabs found</p>
        <p class="empty-sub">Open a Zoom meeting in your browser and try again.</p>
      </div>
    </div>
  </section>

  <!-- Action Buttons -->
  <section class="actions">
    <button class="btn btn-start" id="startBtn" disabled>
      <span>🔴</span> Start Recording
    </button>
    <button class="btn btn-stop" id="stopBtn" disabled>
      <span>⏹</span> Stop &amp; Save Notes
    </button>
  </section>

  <!-- Toast / message -->
  <div class="toast" id="toast" role="status" aria-live="assertive"></div>

  <!-- Dashboard -->
  <footer class="footer">
    <button class="btn btn-dashboard" id="dashboardBtn">
      📋 Open Dashboard
    </button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
